name: OVH EU VPS stock check

on:
  schedule:
    # Every 5 minutes, deliberately offset off the :00/:05 boundaries. GitHub
    # queues every runner in the world on those marks, and high-frequency crons
    # are the first thing dropped when Actions is congested; an odd offset gets
    # noticeably better delivery.
    #
    # Scheduled runs are best-effort regardless: expect delays, and treat this
    # as a backstop to the 30-second local watcher, not a replacement for it.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race on the state.json commit.
concurrency:
  group: ovh-stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # v4 runs on Node 20, which GitHub has deprecated. v5+ is the Node 24 line.
      # The "Persist state" step below relies on checkout leaving usable push
      # credentials behind; v6 changed where those are stored, so if that step
      # ever starts failing to push, suspect this bump first.
      - uses: actions/checkout@v7

      - name: Check OVH EU availability
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
        run: ./check.ps1

      - name: Persist state if it changed
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "State unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: EU availability changed [skip ci]"
          # A concurrent run could have pushed first; rebase and retry once.
          git push || { git pull --rebase --autostash && git push; }
